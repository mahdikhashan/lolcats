# Build the training image on GitHub's machines and push it to Docker Hub
# -> Needs repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (Docker Hub access token, Read & Write)
# -> Run it from the Actions tab: "Docker image" → "Run workflow"
name: Docker image

on: workflow_dispatch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the image is about 15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: make docker-build docker-push IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/lolcats
