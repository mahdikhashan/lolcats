name: llama-1b
# Lizard attention v3 (src/model/linear_attention/lizard_attention_v3.py, docs/16-lizard-attention-v3.md)
# Copy of distill_llama3_2_1b_lizard_v2_w128_fd32_m4_fp32.yaml with attention_type lolcats_llama_lizard_v3.
# All options below have the v3 defaults. The only default that differs from v1 and v2: alpha stays at
# alpha_init = 1.0 and is not trained (train_alpha: false), as the paper lists only phi, W_gamma and t as learnable.
model:
  pretrained_model_name_or_path: "meta-llama/Llama-3.2-1B"
  cache_dir: "/workspace/lolcats/scratch/"   # CHANGE this
  return_dict: true
  device_map: auto
  low_cpu_mem_usage: true
  torch_dtype: float32                      # float32 model, as in the second round (docs/experiments/float32.md)
  rope_theta: 500000.0                      # Llama 3.2 uses 500K theta (NOT 10000 like Mistral)
  attn_implementation: eager                # FlashAttention-2 supports only fp16 and bf16

attention:
  attention_type: lolcats_llama_lizard_v3

  # As in v1 and v2
  feature_dim: 32                           # features in EACH Hedgehog half; phi(x) has 2 x feature_dim features
  window_size: 128
  num_meta: 4                               # sink logits t_j enter the window denominator as exp(t_j)

  # v3 options (v3 defaults)
  gla_norm: row                 # row | none | joint | hybrid (as in v2)
  alpha_per_head: false
  alpha_init: 1.0
  train_alpha: false            # v3 default: alpha is a buffer at alpha_init (v1 and v2 train it)
  feature_map_per_head: false
  feature_activation: softmax   # softmax (Table 13) | exp (Section 4)
  gate_per_head: false
  gate_bias_init: null
  window_rope: false
  gla_impl: direct              # direct | reparam (reparam needs feature_activation: exp)

  # Which layers stay softmax (none — fully linearize)
  softmax_attentions: []

  # Train all attention layers
  train_attention: true
  remove_base_attn: true                    # Free original softmax weights after distill
