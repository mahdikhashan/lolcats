# Stage 1 with the learning rate and the schedule of the Lizard paper (docs/experiments/paper-lr.md),
# and mse_factor 1. Everything else is the same as distill_alpaca_clean_xent0_mse1000_lr1e-2_1b.yaml.
dataset:
  name: alpaca_clean
  dataset_config:
    name: default
    path: yahma/alpaca-cleaned
    chunk_size: 2048  # sequence length for distilling
    concat_data: true
    cache_dir: 'data/alpaca'  # Change this to where you want to save
  pretrained_model_config:  # will be updated based on model_config
    pretrained_model_name_or_path: 'meta-llama/Meta-Llama-3-1B'
    cache_dir: '/workspace/scratch/'
  preprocess_config: null

dataloader:
  batch_size: 1
  num_workers: 2
  drop_last: false
  pin_memory: true

optimizer:
  optim: adamw_torch_fused
  lr: 0.001          # Lizard paper, Table 13: peak learning rate of stage 1 (the LoLCATs config uses 0.01)
  weight_decay: 0.0

lr_scheduler:        # Lizard paper: cosine schedule with a 10% linear warmup
  lr_scheduler_type: cosine_warmup  # transformers.get_cosine_schedule_with_warmup, one step per optimizer step
  num_warmup_steps: 118             # 10% of the 1,178 optimizer steps of stage 1 (2 epochs x 589)
  num_training_steps: 1178          # decays to 0 at the last step (the paper decays to 0.1x the peak)

trainer:  # HuggingFace Trainer-like arguments  
  name: distill_attention_xent_mse
  reverse_kl: false
  mse_factor: 1      # loss = (1/N) sum over the N layers of the mean squared error of each layer (the LoLCATs config uses 1000)
  xent_factor: 0
  
  bf16: true
  train_split: train
  val_split: validation
  num_train_epochs: 2
  gradient_accumulation_steps: 8
  seed: 42
  batch_size: 1
  load_best_model_at_end: true
  greater_is_better: false
  metric_for_best_model: distill/eval/loss
  logging_steps: 100
  evaluation_strategy: steps
  max_steps: -1
  eval_steps: 100
  max_eval_batches: null
